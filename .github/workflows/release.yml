---
name: Release
concurrency: changelog
on:
  release:
    types: [released]
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.release.outputs.branch }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14'}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, commit, push branch and open PR
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          BASE_BRANCH: ${{ github.event.release.target_commitish }}
          REPO: ${{ github.repository }}
        run: |
          # One command does everything the bump job used to do in shell:
          # bump changelog + version files, branch, [skip ci] commit,
          # --force-with-lease push, and open the release PR. The [skip ci]
          # decision follows [defaults].skip_ci (default true).
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          VERSION="${RELEASE_VERSION#v}"
          CURRENT_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Release version ${VERSION} is already prepared; skipping changelog/version bump."
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "branch=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --json is a global flag, so it must precede the `release-bump`
          # subcommand (argparse rejects it if placed after).
          uv run kaclm --json release-bump \
            --version "$VERSION" \
            --base "$BASE_BRANCH" \
            --release-id "$RELEASE_ID" \
            --repository "$REPO" \
            --open-pr \
            --title "chore: release ${VERSION}" \
            --body "Automated release PR for ${VERSION}. Merge once the PyPI publish succeeds." \
            --yes > release-bump.json
          echo "version=$(python -c "import json;print(json.load(open('release-bump.json'))['version'])")" >> "$GITHUB_OUTPUT"
          echo "branch=$(python -c "import json;print(json.load(open('release-bump.json'))['branch'])")" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-latest
    needs: bump
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14'}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Pin npm
        run: npm install -g npm@11.10.0
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Sync dependencies
        run: uv sync --frozen --all-extras
      - name: Build
        run: chmod +x scripts/*.sh && make build-wheel
      - name: Verify dist version matches release
        env:
          EXPECTED: ${{ needs.bump.outputs.version }}
        run: |
          WHEEL=$(ls dist/*.whl 2>/dev/null | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          if ! echo "$WHEEL" | grep -q "${EXPECTED}"; then
            echo "::error::Wheel ${WHEEL} does not contain expected version ${EXPECTED}"
            exit 1
          fi
          echo "Verified: ${WHEEL} matches version ${EXPECTED}"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/mastodon-is-my-blog
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/
      # Fail before uploading: the publish action's bundled twine rejects
      # metadata it cannot parse (e.g. Metadata-Version 2.5 from hatchling),
      # which otherwise only surfaces after the release is already tagged.
      - name: Validate distribution metadata
        run: uv run --with 'twine>=7' twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: 'true'
